<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maanlegging</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&family=Yellowtail&display=swap">
<style>
/* Layout: een koraalkleurig "scherm" op pastelvlekken, bovenaan het schriftlogo met tabs, daaronder kleurblokken (crème, geel) met afgeronde kaarten. Eén bewust speelse, eenkleurige look; alles loopt via tokens. */
:root{
  --blob-a:#ffd5c8; --blob-b:#c9f7f0; --blob-c:#ffe9e2;
  --field:#ee4f2d; --field-deep:#d83f1f; --yellow:#ffe14a; --cream:#fff5e1; --ink:#3b130c; --ink-soft:#7d4c40; --blue:#3a36e0; --mint:#c9f7f0;
  --fg:var(--cream); --muted:#ffdccf; --line:rgba(255,245,225,.35); --label:var(--yellow);
  --font-body:"Mulish",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-logo:"Yellowtail","Snell Roundhand","Brush Script MT",cursive;
  --radius:26px; color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--blob-a)}
body{margin:0;background:var(--blob-a);color:var(--ink);font:15px/1.5 var(--font-body);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 100px;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);background:var(--field);z-index:30}
body::after{content:"";position:fixed;z-index:-1;right:-22vmin;top:-8vmin;width:95vmin;height:95vmin;border-radius:46% 54% 41% 59%/55% 43% 57% 45%;background:var(--blob-b);pointer-events:none}
h1,h2,h3,h4{font-family:var(--font-body);font-weight:800;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.screen{max-width:760px;margin:clamp(8px,3vw,28px) auto 0;background:var(--field);color:var(--fg);border-radius:34px;overflow:clip;min-height:70vh}
.wrap{display:flex;flex-direction:column;gap:20px;padding:20px clamp(14px,3vw,24px) 30px}
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--field);padding:16px clamp(14px,3vw,24px) 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:var(--font-logo);font-weight:400;font-size:38px;line-height:1;color:var(--yellow);letter-spacing:.01em}
.brand span{color:var(--yellow);font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
nav.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:8px 10px 6px;color:var(--cream);font-weight:800;font-size:16px;opacity:.85}
nav.tabs button[aria-current="true"]{color:var(--yellow);border-color:var(--yellow);opacity:1}
.panel{--fg:var(--ink);--muted:var(--ink-soft);--line:#ecd5bf;--label:var(--blue);background:var(--cream);color:var(--ink);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.hl{background:var(--yellow);--line:rgba(59,19,12,.2)}
.panel.flat{background:none;border-radius:0;padding:0;--fg:var(--cream);--muted:var(--muted);color:var(--cream);--label:var(--yellow)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:800}
.btn{background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:800}
.panel .btn{background:var(--cream);border-color:var(--ink)}
.panel.hl .btn{background:var(--cream)}
.btn.primary,.panel .btn.primary{background:var(--field);color:var(--cream);border-color:var(--field)}
.btn.ghost,.panel .btn.ghost{background:none;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.screen>.wrap>.btn.ghost{color:var(--cream)}
.btn.danger{color:#b3150f}
.btn.sm{padding:5px 13px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 13px}
input[type=checkbox]{accent-color:var(--field);width:18px;height:18px}
textarea{min-height:88px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:800;background:var(--mint);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--mint);color:#0d5b43}
.chip.warn{background:var(--yellow);color:#6a3200}
.chip.acc{background:var(--blue);color:#fff;border-radius:6px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthbar h1{font-size:clamp(24px,6vw,32px);text-align:center;flex:1;color:var(--yellow);padding-bottom:4px;border-bottom:4px solid var(--yellow)}
.hw{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hw li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 0;border-top:2px solid var(--line)}
.hw li:first-child{border-top:0}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.slot{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;min-width:0;color:inherit}
.slot .pos{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.25;color:var(--ink);font-weight:800;min-height:30px}
.slot .pos b{flex:none;width:19px;height:19px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px}
.art{display:block;aspect-ratio:300/527;border-radius:20px;overflow:hidden;background:var(--mint);border:2px solid var(--ink)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art img.rev{transform:rotate(180deg)}
.art.back{background:repeating-linear-gradient(135deg,var(--field) 0 7px,var(--yellow) 7px 14px)}
.art.empty{border-style:dashed;background:none;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.nm{font-size:12.5px;line-height:1.25;font-weight:800;min-width:0;overflow-wrap:anywhere}
.nm em{display:block;font-style:normal;font-weight:600;color:#a33a00;font-size:11.5px}
.slotbtns{display:flex;flex-direction:column;gap:5px}
.quote{border-left:5px solid var(--field);padding:2px 0 2px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.notice{border-radius:18px;padding:12px 14px;background:var(--yellow);color:var(--ink);font-size:14px}
.panel.hl .notice{background:var(--cream)}
.notice.stop{background:var(--blue);color:#fff}
.note{border-top:2px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:7px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.weet{background:var(--mint);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;--label:var(--blue)}
.weet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.thumb{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;color:var(--cream)}
.thumb .art{border-color:var(--cream)}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filters button{border:2px solid var(--cream);background:none;color:var(--cream);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:800}
.filters button[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.screen input[type=search]{border-color:var(--cream)}
details{--fg:var(--ink);--muted:var(--ink-soft);--line:#ecd5bf;background:var(--cream);color:var(--ink);border-radius:var(--radius);padding:0 18px}
details>summary{cursor:pointer;padding:16px 0;font-weight:800;font-size:16px}
details[open]>summary{border-bottom:2px solid var(--line);margin-bottom:12px}
details .body{padding-bottom:18px;display:flex;flex-direction:column;gap:10px}
details ul,details ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-top:2px solid var(--line);padding:7px 8px 7px 0;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(59,19,12,.55);display:flex;justify-content:center;align-items:flex-end;padding-top:env(safe-area-inset-top, 0px)}
.sheetbox{--fg:var(--ink);--muted:var(--ink-soft);--line:#ecd5bf;--label:var(--blue);background:var(--cream);color:var(--ink);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;padding:20px max(16px, env(safe-area-inset-left, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.cardhead{display:flex;gap:14px;align-items:flex-start}
.cardhead .art{width:116px;flex:none}
.pick{display:flex;flex-direction:column;gap:2px}
.pickrow{display:flex;gap:12px;align-items:center;background:none;border:0;border-bottom:2px solid var(--line);padding:7px 0;text-align:left;width:100%;color:inherit}
.pickrow .art{width:36px;flex:none;border-radius:8px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--blue);color:#fff;padding:10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#player audio{flex:1;min-width:180px;max-width:100%}
#player .btn{background:var(--yellow);border-color:var(--yellow)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--blue);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:800;max-width:90%}
.filebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
@media (max-width:420px){.slot .pos span{font-size:11px}.nm{font-size:11.5px}.brand b{font-size:34px}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div id="app"><div class="wrap"><p class="muted">Maanlegging wordt geladen…</p></div></div>
<div id="sheet" hidden></div>
<div id="player" hidden><span id="pl-label" class="small"></span><audio id="pl-audio" controls preload="none"></audio><button type="button" class="btn sm ghost" data-act="player-close">Sluit</button></div>
<div id="toast" hidden></div>

<script>
/* [id, nl, en, rechtop, omgekeerd, [[beeld, betekenis]...], astro] — id: m00-m21, w/c/s/p 01-14 (11 page, 12 ridder, 13 koningin, 14 koning) */
const CARD_ROWS = [
["m00","De Dwaas","The Fool","Nieuw begin, onbevangenheid, een sprong in het onbekende.","Roekeloosheid, twijfel vlak voor de sprong, naïef risico nemen.",[["Klif","Je staat aan de rand van het bekende en staat op het punt iets nieuws te betreden."],["Witte hond","Instinct dat vrolijk waarschuwt: luister naar je gevoel, maar blijf lopen."],["Witte roos","Zuivere wens en onschuld; je neemt geen last mee, alleen een bundeltje."]],"Lucht · Uranus"],
["m01","De Magiër","The Magician","Wilskracht, vaardigheid, alle middelen liggen binnen handbereik.","Manipulatie, onbenut talent, mooie praatjes zonder inhoud.",[["Liggende acht boven het hoofd","Onbegrensde mogelijkheden en bewuste aandacht."],["Staf, beker, zwaard en pentakel op tafel","Je beschikt over alle vier de elementen: vuur, water, lucht en aarde."],["Eén hand omhoog, één omlaag","Wat boven is, is ook beneden: een idee omzetten in een daad."]],"Mercurius"],
["m02","De Hogepriesteres","The High Priestess","Intuïtie, verborgen kennis, stilte voordat antwoorden komen.","Een genegeerde innerlijke stem, geheimen, oppervlakkigheid.",[["Zwarte en witte pilaar","Twee tegenstellingen waartussen je de poort naar het onbekende vindt."],["Sluier met granaatappels","Vruchtbaarheid en het verborgene; wat achter de sluier zit, krijg je niet cadeau."],["Maansikkel aan haar voeten","Intuïtie en cycli; je weet iets zonder te kunnen zeggen waarom."]],"Maan"],
["m03","De Keizerin","The Empress","Overvloed, zorg, creativiteit, groei.","Overbezorgdheid, afhankelijkheid, een creatieve blokkade.",[["Rijp korenveld","Oogst en vruchtbaarheid: wat je zaaide, komt op."],["Hartvormig schild met Venusteken","Liefde, zinnelijkheid en het lichaam als bron van wijsheid."],["Kroon van twaalf sterren","Zij heerst over de kring van het jaar, over twaalf maanden en seizoenen."]],"Venus"],
["m04","De Keizer","The Emperor","Structuur, gezag, stabiliteit, bescherming.","Starheid, dwang, controledrang, of juist gebrek aan leiding.",[["Troon met ramskoppen","Ram, Mars en vuur: wil en initiatief."],["Rode mantel onder harnas","Passie die onder controle is gebracht."],["Kale bergen achter hem","Hard, onbuigzaam terrein: stevigheid, maar weinig zachtheid."]],"Vuur · Ram"],
["m05","De Hogepriester","The Hierophant","Traditie, begeleiding, gedeelde waarden, leren van een leermeester.","Dogma, tegendraads zijn om het tegendraads zijn, regels die niet meer passen.",[["Twee volgelingen aan zijn voeten","Kennis wordt doorgegeven; je leert van wie het al weet."],["Gekruiste sleutels","Toegang tot kennis, aards en hemels."],["Drievoudig kruis op zijn staf","Drie lagen: lichaam, ziel en geest."]],"Aarde · Stier"],
["m06","De Geliefden","The Lovers","Keuze uit het hart, verbinding, waarden op één lijn.","Onbalans, twijfel, een uitgestelde keuze, wrijving.",[["Engel boven het paar","Zegen en een hogere liefde: de keuze krijgt betekenis."],["Boom met slang en boom met vlammen","Verleiding en passie; kennis en verlangen horen bij elkaar."],["Hij kijkt naar haar, zij naar de engel","Waar je naar kijkt, bepaalt wat je kiest."]],"Lucht · Tweelingen"],
["m07","De Zegewagen","The Chariot","Vastberadenheid, overwinning door focus, richting.","Gebrek aan richting, agressie, de controle kwijt.",[["Zwarte en witte sfinx","Tegengestelde krachten die je onder één wil moet brengen."],["Sterrenbaldakijn","Hemelse steun voor wie weet waar hij heen wil."],["Geen teugels in zijn handen","Wilskracht stuurt, niet geweld."]],"Water · Kreeft"],
["m08","Kracht","Strength","Zachte kracht, moed, mildheid die temt.","Zelftwijfel, ruwe kracht, opgekropte emotie.",[["Liggende acht boven haar hoofd","Innerlijke kracht en onbegrensde wil."],["Leeuw die zich laat aaien","Instinct wordt getemd door zachtheid, niet door dwang."],["Witte jurk en bloemenkrans","Zuivere bedoeling."]],"Vuur · Leeuw"],
["m09","De Kluizenaar","The Hermit","Introspectie, wijsheid, bewust alleen zijn.","Isolatie, terugtrekken uit angst, advies lang negeren.",[["Lantaarn met zespuntige ster","Een klein licht voor de volgende stap, niet voor de hele weg."],["Staf","De steun van ervaring."],["Besneeuwde bergtop","Eenzaam gezichtspunt met overzicht."]],"Aarde · Maagd"],
["m10","Rad van Fortuin","Wheel of Fortune","Keerpunt, cycli, geluk dat draait.","Tegenslag, weerstand tegen verandering, herhaling.",[["Vier gevleugelde wezens in de hoeken","Stier, leeuw, adelaar en mens: de vier vaste krachten die het lot bewaken."],["Slang omlaag, Anubis omhoog","Wat zakt, stijgt weer; het rad draait."],["Letters T-A-R-O en ROTA op het rad","Rota is rad: alles keert terug in een andere vorm."]],"Vuur · Jupiter"],
["m11","Gerechtigheid","Justice","Eerlijkheid, oorzaak en gevolg, helder oordeel.","Oneerlijkheid, verantwoordelijkheid ontwijken, vooroordeel.",[["Zwaard omhoog","Helder denken en een beslissing die snijdt."],["Weegschaal","Afwegen: elke daad heeft een gevolg."],["Kroon en rode mantel","Gezag dat uit overtuiging komt."]],"Lucht · Weegschaal"],
["m12","De Gehangene","The Hanged Man","Loslaten, ander perspectief, vrijwillige pauze.","Stilstand, offer zonder doel, vastklampen.",[["Aureool rond het hoofd","Inzicht door overgave."],["Rustig gezicht, één been gekruist","Het is vrijwillig, geen straf."],["Levende boom in T-vorm","Groei vanuit stilstand."]],"Water · Neptunus"],
["m13","De Dood","Death","Afsluiting, transformatie, iets moet eindigen.","Verzet tegen verandering, vastzitten tussen oud en nieuw.",[["Skelet in zwart harnas op wit paard","De onvermijdelijke, eerlijke ruiter; hij kiest niemand uit."],["Witte roos op de vlag","Zuivere wedergeboorte."],["Zon die tussen twee torens opkomt","Een nieuwe dag na het einde."]],"Water · Schorpioen"],
["m14","Gematigdheid","Temperance","Balans, geduld, de juiste mengverhouding.","Onevenwicht, overdaad, haast.",[["Water tussen twee bekers","Gevoel en gedachte, in stroming gehouden."],["Eén voet in het water, één op het land","Een brug tussen onderbewust en bewust."],["Pad naar een kroon aan de horizon","Een lange weg naar voltooiing."]],"Vuur · Boogschutter"],
["m15","De Duivel","The Devil","Gebondenheid, verleiding, schaduwkant, gewoontes.","Loskomen, de ketens zien, afhankelijkheid verbreken.",[["Losse kettingen om hun nek","De ketens zitten niet vast: je kunt eruit."],["Omgekeerd pentagram","Materie boven geest."],["Staarten met vruchten en vlam","Verlangen, zinnelijkheid en dorst."]],"Aarde · Steenbok"],
["m16","De Toren","The Tower","Plotselinge omwenteling, valse zekerheid stort in.","Een ramp ontwijken, verandering uitstellen, de nasleep.",[["Bliksem","Plotseling inzicht of schok."],["Kroon die eraf vliegt","Oude gedachten en trots vallen weg."],["Vallende figuren","Loslaten wat je dacht te beheersen."]],"Vuur · Mars"],
["m17","De Ster","The Star","Hoop, genezing, vertrouwen na de storm.","Ontmoediging, vertrouwen kwijt, een slapende hoop.",[["Acht sterren, één grote","Hoop en leiding."],["Water in de vijver en op het land","Geven aan gevoel én aan de aarde."],["Ibis in de boom","De vogel van Thoth: wijsheid die je rustig toekijkt."]],"Lucht · Waterman"],
["m18","De Maan","The Moon","Illusie, onderbewuste, angst en dromen.","Verwarring trekt weg, angst loslaten, verdrongen gevoel.",[["Hond en wolf huilen naar de maan","Het tamme en het wilde in onszelf."],["Kreeft kruipt uit het water","Een oude, diepe emotie komt boven."],["Pad tussen twee torens","Je gaat door onzekerheid heen, niet eromheen."]],"Water · Vissen"],
["m19","De Zon","The Sun","Vreugde, helderheid, succes, vitaliteit.","Tijdelijke bewolking, overdreven optimisme.",[["Kind op een wit paard","Onbevangenheid en vertrouwen."],["Zonnebloemen","Groeien naar het licht."],["Rode banier","Levenskracht."]],"Zon"],
["m20","Het Oordeel","Judgement","Roeping, afrekening met het verleden, een nieuwe fase.","Zelfkritiek, de roep negeren, niet kunnen vergeven.",[["Engel met trompet","Een oproep om op te staan."],["Figuren die uit kisten opstaan","Het verleden wordt vrijgemaakt en vernieuwd."],["Bergen en golf","Een grote, onvermijdelijke kracht."]],"Vuur · Pluto"],
["m21","De Wereld","The World","Voltooiing, integratie, rond zijn met een fase.","Bijna klaar, onaf blijven, afronding uitstellen.",[["Lauwerkrans","Overwinning; de cyclus is rond."],["Vier figuren in de hoeken","De vier elementen in balans."],["Danser met twee staven","Beweging; evenwicht tussen nemen en geven."]],"Aarde · Saturnus"],

["w01","Aas van Staven","Ace of Wands","Een vonk, nieuwe drive, kans om te beginnen.","Vertraagde start, bevlogenheid zonder richting.",[["Hand uit een wolk met staf","Een gave van buitenaf: de vonk."],["Groene blaadjes aan de staf","Het leeft nog en groeit."]]],
["w02","Twee van Staven","Two of Wands","Plannen maken, kiezen tussen blijven en gaan.","Angst voor het onbekende, plannen blijven in het hoofd.",[["Man met wereldbol op de muur","Je overziet je mogelijkheden."],["Eén staf in zijn hand, één vastgezet","Je houdt jezelf al vast; de keuze moet nog."]]],
["w03","Drie van Staven","Three of Wands","Vooruitkijken, uitbreiding, wachten op de oogst.","Tegenslag in plannen, te weinig overzicht.",[["Man kijkt vanaf klif naar schepen","Je plannen zijn onderweg."],["Drie staven in de grond","Het fundament staat."]]],
["w04","Vier van Staven","Four of Wands","Feest, thuiskomst, mijlpaal.","Onrust thuis, een uitgestelde viering.",[["Bloemslingers tussen de staven","Vreugde en gemeenschap."],["Kasteel op de achtergrond","Een veilige basis."]]],
["w05","Vijf van Staven","Five of Wands","Strijd, botsende meningen, speelse competitie.","Conflict vermijden, uitputtende ruzie.",[["Vijf figuren zwaaien door elkaar","Veel stemmen, geen leiding."],["Geen echte klappen","Een oefenwedstrijd, geen oorlog."]]],

});

const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return cap(new Intl.DateTimeFormat('nl-NL',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)))};
const fmtTime=t=>new Intl.DateTimeFormat('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(t));
const pad=n=>String(n).padStart(3,'0');
function rndInt(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function rndBool(){return rndInt(2)===1}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawDistinct(n,pool){const p=pool.slice(),out=[];while(out.length<n&&p.length){out.push(p.splice(rndInt(p.length),1)[0])}return out}
function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return 'Opslaan lukt niet: je hebt hier geen schrijfrechten of de gegevens zijn ongeldig.';if(c==='quota_exceeded')return 'De opslag is vol.';if(c==='resource_exhausted')return 'Even rustig aan, probeer het zo opnieuw.';return (e&&e.message)||'Er ging iets mis.'}

function downscale(file,maxW){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,maxW/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);let d=cv.toDataURL('image/webp',.85);if(!/^data:image\/webp/.test(d))d=cv.toDataURL('image/jpeg',.85);res(d)};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Afbeelding kon niet worden gelezen.'))};
    im.src=url;
  });
}

/* ---------- weetjes over symboliek (drie per legging) ---------- */
function weetjes(spread){
  const cs=spread.cards.map(c=>({c:BYID[c.id],rev:c.rev})).filter(x=>x.c);
  const rnd=mulberry(hash(spread.month+spread.uid)),out=[];
  const minors=cs.filter(x=>x.c.suit);
  if(minors.length){
    const cnt={};minors.forEach(x=>cnt[x.c.suit]=(cnt[x.c.suit]||0)+1);
    const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0],s=SUITS[top];
    out.push({label:'Element',text:s.naam+' hoort bij '+s.el+' en gaat over '+s.thema+'. Onthoud het als werkwoord: '+s.naam.toLowerCase()+' = ik '+s.werk+'. In jouw legging komt dit '+cnt[top]+(cnt[top]===1?' keer':' keer')+' voor.'});
  }else{
    out.push({label:'Grote Arcana',text:'De grote arcana gaan over grote thema\'s in je leven. Staan ze (bijna) allemaal in je legging, dan zit je in een betekenisvol hoofdstuk, en gaat het minder om dagelijkse kleine dingen.'});
  }
  const withCue=cs.filter(x=>x.c.cues&&x.c.cues.length);
  if(withCue.length){
    const x=withCue[Math.floor(rnd()*withCue.length)],cue=x.c.cues[Math.floor(rnd()*x.c.cues.length)];
    out.push({label:'Beeld',text:'Op '+x.c.nl+' zie je: '+cue[0].toLowerCase()+'. '+cue[1]});
  }
  const revCard=cs.find(x=>x.rev);
  if(revCard){
    out.push({label:'Omgekeerd',text:revCard.c.nl+' staat omgekeerd. Dat is niet automatisch slecht: de energie stroomt niet vrij, is naar binnen gericht of nog niet uitgesproken. Lees dan: '+revCard.c.rev.charAt(0).toLowerCase()+revCard.c.rev.slice(1)});
  }else{
    const numbered=minors.filter(x=>x.c.n>=1&&x.c.n<=14);
    if(numbered.length){
      const x=numbered[Math.floor(rnd()*numbered.length)];
      if(x.c.n<=10)out.push({label:'Getal',text:'Een '+x.c.n+' staat voor '+NUMS[x.c.n]+'. Dat zie je terug op '+x.c.nl+'.'});
      else out.push({label:'Hofkaart',text:'Een '+COURT[x.c.n][0]+' is '+COURT[x.c.n][1]+'. Zo lees je '+x.c.nl+'.'});
    }else{
      const m=cs.find(x=>x.c.astro)||cs[0];
      if(m&&m.c.astro)out.push({label:'Verbinding',text:m.c.nl+' hoort bij '+m.c.astro.toLowerCase()+'. Elke grote kaart heeft zo een element en een planeet of dierenriemteken.'});
    }
  }
  return out.slice(0,3);
}

/* ---------- audio ---------- */
function readAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Bestand kon niet worden gelezen.'));r.readAsDataURL(file)})}
function guessMime(f){if(f.type&&/^audio\//.test(f.type))return f.type;const e=(f.name.split('.').pop()||'').toLowerCase();return {m4a:'audio/mp4',mp4:'audio/mp4',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',webm:'audio/webm',aac:'audio/aac',opus:'audio/ogg'}[e]||'audio/mp4'}
async function setWithRetry(ref,data){try{await ref.set(data)}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));await ref.set(data)}else throw e}}
async function saveAudio(file,onProgress){
  if(file.size>MAX_AUDIO)throw new Error('Dit bestand is te groot (maximaal 6 MB). Neem korter op of kies een kleiner formaat.');
  const url=await readAsDataURL(file),b64=url.slice(url.indexOf(',')+1),id='a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),parts=Math.ceil(b64.length/CHUNK);
  for(let i=0;i<parts;i++){await setWithRetry(S.db.doc('audio/'+id+'/parts/'+pad(i)),{i,d:b64.slice(i*CHUNK,(i+1)*CHUNK)});onProgress(i+1,parts)}
  return {id,mime:guessMime(file),parts,size:file.size};
}
const audioCache={};
async function loadAudio(a){
  if(audioCache[a.id])return audioCache[a.id];
  const snap=await S.db.collection('audio/'+a.id+'/parts').orderBy('i').get();
  const b64=snap.docs.map(d=>d.data().d).join('');
  const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const e={blob:URL.createObjectURL(new Blob([u8],{type:a.mime})),data:'data:'+a.mime+';base64,'+b64};
  audioCache[a.id]=e;return e;
}
async function playNote(id){
  const n=S.notes.find(x=>x.id===id);if(!n||!n.audio)return;
  const pl=$('#player'),au=$('#pl-audio');
  $('#pl-label').textContent='Audionoot van '+nameOf(n.author)+' laden…';pl.hidden=false;
  try{
    const e=await loadAudio(n.audio);let tried=false;
    au.onerror=()=>{if(!tried){tried=true;au.src=e.data;au.play().catch(()=>{})}};
    au.src=e.blob;$('#pl-label').textContent='Audionoot van '+nameOf(n.author);
    au.play().catch(()=>{});
  }catch(err){toast('Audio laden mislukt.');pl.hidden=true}
}
async function deleteNote(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  try{
    if(n.audio){for(let i=0;i<n.audio.parts;i++)await S.db.doc('audio/'+n.audio.id+'/parts/'+pad(i)).delete();delete audioCache[n.audio.id]}
    await S.db.doc('notes/'+id).delete();toast('Verwijderd');
  }catch(e){toast(errMsg(e))}
}

  const d=S.draft,intent=(S.drafts['d-int']||'').trim(),key=S.month;
  if(!(d.revealed.length===4||d.stopped)||!d.revealed.length){toast('Draai eerst je kaarten om.');return}

async function saveNote(kind,sid){
  const key=kind+'-'+sid,text=(S.drafts['t-'+key]||'').trim(),file=S.files['f-'+key];

function maandView(){
  const gate=needDb();if(gate)return gate;
  const key=S.month,list=monthsList(),ix=list.indexOf(key);
  let h='';
  if(S.canWrite===false)h+='<div class="notice">Je kunt alleen meekijken. Vraag de eigenaar van deze pagina om je als bijdrager toe te voegen, dan kun je ook leggen en reageren.</div>';
  h+='<div class="monthbar"><button type="button" class="btn" data-act="month" data-d="-1" '+(ix<=0?'disabled':'')+' aria-label="Vorige maand">←</button>'
    +'<h1>'+esc(monthLabel(key))+'</h1><button type="button" class="btn" data-act="month" data-d="1" '+(ix<0||ix>=list.length-1?'disabled':'')+' aria-label="Volgende maand">→</button></div>';
  if(!me()){
    h+=joinPanel();return h;
  }
  h+=spotlightPanel(key);
  const myId=spreadId(key,S.uid),mine=S.spreads[myId];
  if(!mine||S.redo[key])h+=composer(key,!!mine);
  const spot=spotlightOf(key),all=spreadsOf(key);
  const ordered=all.slice().sort((a,b)=>(b.uid===spot)-(a.uid===spot)||(a.uid===S.uid?-1:1)-(b.uid===S.uid?-1:1));
  ordered.forEach(sp=>{if(!(sp.uid===S.uid&&S.redo[key]))h+=spreadCard(sp,sp.uid===spot)});
  if(!all.length&&(mine||S.redo[key]))h+='';
  if(!all.length)h+='<div class="panel flat"><p class="muted">Nog niemand heeft deze maand gelegd.</p></div>';
  return h;
}

    else if(d.stopped)h+=slotClosed(i,'Niet omgedraaid');

    else{h+='<div class="slot"><span class="pos"><b>'+POS[i].n+'</b><span>'+esc(POS[i].name)+'</span></span><span class="art empty">Leeg</span>'+((d.mode==='eigen'&&i===n)?'<button type="button" class="btn sm primary" data-act="pick-open" data-purpose="next">Kaart invullen</button>':'')+'</div>'}
  }
  h+='</div>';
  if(n<4&&!d.stopped&&n<4){
    const next=POS[n];
    if(d.mode==='digital'&&!hasDraw)h+='<div class="row"><button type="button" class="btn primary" data-act="draw">Schud en trek vier kaarten</button></div>';
    if(hasDraw||d.mode==='eigen')h+='<div class="notice"><b>Kaart '+next.n+' · '+esc(next.name)+'.</b> '+esc(next.q)+'</div>';
  }
  if(d.stopped){
    const last=BYID[d.revealed[d.revealed.length-1].id];
    h+='<div class="notice stop"><b>Veiligheidskaart: '+esc(last.nl)+'. Stop de legging.</b><br>Je kijkt niet naar de overige kaarten. Sluit je ogen en neem een moment voor jezelf. Dit is het inzicht waar je om hebt gevraagd; wat je ermee doet, is aan jou. Het antwoord vind je bij jezelf.</div>';
  }
  h+='<div class="row">';
  if(n&&d.mode==='eigen'&&!hasDraw)h+='<button type="button" class="btn sm ghost" data-act="undo">Laatste kaart wissen</button>';
  if(n||hasDraw)h+='<button type="button" class="btn sm ghost" data-act="reset-draft">Opnieuw beginnen</button>';
  if(isRedo)h+='<button type="button" class="btn sm ghost" data-act="cancel-redo">Annuleren</button>';
  h+='</div></div>'
   +'<div class="row"><button type="button" class="btn primary" data-act="save-spread" '+((d.revealed.length===4||d.stopped)&&d.revealed.length&&!S.busy.save?'':'disabled')+'>'+(S.busy.save?'Bewaren…':'Bewaar legging')+'</button><span class="muted small">Je legging wordt zichtbaar voor de groep.</span></div></section>';
  return h;
}

function spreadCard(sp,isSpot){
  const sid=spreadId(sp.month,sp.uid),mineSp=sp.uid===S.uid,owner=nameOf(sp.uid);
  const cards=(sp.cards||[]).map(c=>({c:BYID[c.id],rev:c.rev}));
  let h='<section class="panel"><div class="row between"><div class="stack" style="gap:2px"><span class="label">'+(mineSp?'Jouw legging':'Legging van '+esc(owner))+'</span><h2>'+esc(owner)+(isSpot?' · spotlight':'')+'</h2></div>'
   +(mineSp?'<button type="button" class="btn sm" data-act="redo">Opnieuw leggen</button>':'')+'</div>';
  if(sp.intention)h+='<div class="stack" style="gap:2px"><span class="label">Intentie</span><div class="quote">'+esc(sp.intention)+'</div></div>';
  h+='<div class="row4">';
  for(let i=0;i<4;i++){
    const x=cards[i];
    if(!x||!x.c){h+=slotClosed(i,sp.stopped?'Niet omgedraaid':'Onbekend');continue}
    const cl=sp.clar&&sp.clar[i];let extra='';
    if(cl&&BYID[cl.id]){const cc=BYID[cl.id];extra='<button type="button" class="slot" data-act="card" data-card="'+cc.id+'" data-rev="'+(cl.rev?1:0)+'" data-pos="-1" aria-label="Verduidelijkingskaart '+esc(cc.nl)+'"><span class="label" style="font-size:10.5px">Verduidelijking</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="art" style="width:34px;flex:none"><img class="'+(cl.rev?'rev':'')+'" src="'+esc(imgOf(cc))+'" alt="" loading="lazy"></span><span class="nm">'+esc(cc.nl)+'</span></span></button>'}
    else if(mineSp&&!sp.stopped)extra='<div class="slotbtns"><button type="button" class="btn sm" data-act="clar-draw" data-spread="'+sid+'" data-idx="'+i+'">Trek extra</button><button type="button" class="btn sm ghost" data-act="pick-open" data-purpose="clar" data-spread="'+sid+'" data-idx="'+i+'">Kies extra</button></div>';
    h+=slotOpen(i,x.c,x.rev,extra);
  }
  h+='</div>';
  if(sp.stopped){const last=cards[cards.length-1];h+='<div class="notice stop">Gestopt bij '+esc(last&&last.c?last.c.nl:'een veiligheidskaart')+'. De overige kaarten zijn niet omgedraaid.</div>'}
  if(mineSp&&cards.length&&!sp.stopped)h+='<p class="muted small">Snapt een kaart er niet op de eerste plek? Trek of kies een verduidelijkingskaart, bij voorkeur uit een ander deck. Of slaap er een nachtje over.</p>';
  const w=weetjes(sp);
  if(w.length)h+='<div class="weet"><span class="label">Drie weetjes over de symboliek in deze legging</span><ul>'+w.map(x=>'<li><b>'+esc(x.label)+'.</b> '+esc(x.text)+'</li>').join('')+'</ul></div>';
  /* eigen interpretatie */
  const own=notesOf(sid,'own');
  h+='<div class="stack"><span class="label">Eigen interpretatie</span>'+(own.length?own.map(noteHtml).join(''):'<p class="muted small">Nog geen interpretatie toegevoegd.</p>');
  if(mineSp)h+=noteForm('own',sid,'Wat zie jij in je legging? Tekst en audio zijn allebei optioneel.','Bewaar interpretatie');
  h+='</div>';
  if(isSpot){
    const rd=notesOf(sid,'reading');
    h+='<div class="stack"><span class="label">Waarzeggingen van de anderen</span>'+(rd.length?rd.map(noteHtml).join(''):'<p class="muted small">Nog geen waarzeggingen. De andere drie nemen elk een verhaal op als audionoot.</p>');
    if(!mineSp)h+=noteForm('reading',sid,'Vertel wat je ziet in deze legging. Neem een audionoot op, tekst erbij mag.','Bewaar waarzegging',true);
    h+='</div>';
  }
  const pt=notesOf(sid,'point');
  h+='<div class="stack"><span class="label">Aanvullingen</span>'+(pt.length?pt.map(noteHtml).join(''):'<p class="muted small">Nog geen aanvullingen.</p>');
  if(!mineSp)h+=noteForm('point',sid,'Kort en puntig: wat valt je op?','Plaats aanvulling');
  h+='</div></section>';
  return h;
}

function noteHtml(n){
  const mine=n.author===S.uid;
  return '<article class="note"><div class="row between"><span><b>'+esc(nameOf(n.author))+'</b> <span class="muted small">'+esc(fmtTime(n.at))+'</span></span>'
   +(mine?'<button type="button" class="btn sm ghost danger" data-act="del-note" data-id="'+esc(n.id)+'">'+(S.confirm===n.id?'Zeker? Tik nogmaals':'Verwijder')+'</button>':'')+'</div>'
   +(n.text?'<p>'+esc(n.text)+'</p>':'')
   +(n.audio?'<div><button type="button" class="btn sm" data-act="play" data-id="'+esc(n.id)+'">▶ Luister · '+(n.audio.size/1048576).toFixed(1)+' MB</button></div>':'')+'</article>';
}

    return '<div class="sheetbox" role="dialog" aria-modal="true" aria-label="Kaart kiezen"><h2>'+esc(title)+'</h2>'
     +'<input type="search" id="pick-q" placeholder="Zoek je kaart" value="'+esc(S.drafts['pick-q']||'')+'">'
     +(allowRev?'<label class="row small" style="gap:6px"><input type="checkbox" data-chg="pickrev" '+(s.rev?'checked':'')+'> De kaart ligt omgekeerd</label>':'')
     +'<div class="pick">'+list.map(c=>'<button type="button" class="pickrow" data-act="pick" data-card="'+c.id+'">'+artHtml(c,false)+'<span><b>'+esc(c.nl)+'</b>'+(c.safety?' <span class="chip warn">veiligheidskaart</span>':'')+'<br><span class="muted small">'+esc(c.arc==='groot'?'Grote arcana':c.safety?'Extra kaart':SUITS[c.suit].naam)+'</span></span></button>').join('')+(list.length?'':'<p class="muted">Geen kaarten gevonden.</p>')+'</div>'
     +'<div class="row"><button type="button" class="btn" data-act="sheet-close">Annuleren</button></div></div>';
  }
  return '';
}

/* ---------- acties ---------- */
function pickCard(id){
  const s=S.sheet,c=BYID[id];if(!c)return;
  if(s.purpose==='next'){
    const d=S.draft;d.revealed.push({id,rev:!!(d.rev&&s.rev)});if(c.safety)d.stopped=true;
  }else{
    const sp=S.spreads[s.spread];setClar(s.spread,s.idx,c,!!(sp&&sp.reversals&&s.rev));
  }
  S.sheet=null;S.drafts['pick-q']='';render();
}
function act(a,t){
  const d=t.dataset;
  switch(a){
    case 'tab':S.tab=d.tab;window.scrollTo(0,0);break;
    case 'month':{const l=monthsList(),i=l.indexOf(S.month)+Number(d.d);if(i>=0&&i<l.length){S.month=l[i];S.draft=freshDraft()}break}
    case 'join':joinGroup();return;
    case 'rename':renameMe();return;
    case 'mode':S.draft.mode=d.mode;break;
    case 'draw':{
      const pool=ALL.slice(),dr=drawDistinct(4,pool);
      S.draft.hidden=dr.map(c=>({id:c.id,rev:S.draft.rev&&rndBool()}));S.draft.revealed=[];S.draft.stopped=false;break}
    case 'flip':{
      const dd=S.draft,nx=dd.hidden[dd.revealed.length];if(!nx)break;
      dd.revealed.push(nx);if(BYID[nx.id].safety){dd.stopped=true;dd.hidden=dd.hidden.slice(0,dd.revealed.length)}break}
    case 'undo':{const dd=S.draft;dd.revealed.pop();dd.stopped=false;break}
    case 'reset-draft':S.draft=freshDraft();break;
    case 'redo':S.redo[S.month]=true;S.draft=freshDraft();break;
    case 'cancel-redo':delete S.redo[S.month];S.draft=freshDraft();break;
    case 'save-spread':saveSpread();return;
    case 'card':S.sheet={type:'card',card:d.card,rev:d.rev==='1',pos:Number(d.pos),fromSpread:Number(d.pos)>=0};break;
    case 'sheet-close':S.sheet=null;break;
    case 'pick-open':S.sheet={type:'pick',purpose:d.purpose,spread:d.spread,idx:d.idx!=null?Number(d.idx):0,rev:false};S.drafts['pick-q']='';break;
    case 'pick':pickCard(d.card);return;
    case 'clar-draw':{
      const sp=S.spreads[d.spread];if(!sp)break;
      const used=new Set(sp.cards.map(c=>c.id));
      const pool=ALL.filter(c=>!c.safety&&!used.has(c.id));
      const c=pool[rndInt(pool.length)];setClar(d.spread,Number(d.idx),c,!!(sp.reversals&&rndBool()));return}
    case 'note-save':saveNote(d.kind,d.spread);return;
    case 'play':playNote(d.id);return;
    case 'del-note':
      if(S.confirm===d.id){S.confirm=null;deleteNote(d.id)}else{S.confirm=d.id;clearTimeout(act.t);act.t=setTimeout(()=>{S.confirm=null;render()},4000)}
      break;
    case 'filter':S.filter=d.f;break;
    case 'player-close':{const au=$('#pl-audio');au.pause();$('#player').hidden=true;return}
  }
  render();
}
document.addEventListener('click',e=>{
  const sh=e.target;if(sh.id==='sheet'){S.sheet=null;render();return}
  const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t);
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.id)return;
  if(el.matches('textarea,input[type=text],input[type=search]')){
    if(el.id==='lib-q'){S.q=el.value;render();return}
    S.drafts[el.id]=el.value;
    if(el.id==='pick-q')render();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.type==='file'&&el.files&&el.files[0]){
    if(el.id.startsWith('f-')){S.files[el.id]=el.files[0];render()}
    else if(el.id.startsWith('sc-')){saveDeckImg(el.id.slice(3),el.files[0])}
    return;
  }
  const c=el.dataset&&el.dataset.chg;if(!c)return;
  if(c==='spot')setSpotlight(el.value);
  else if(c==='rev'){S.draft.rev=el.checked;render()}
  else if(c==='pickrev'){S.sheet.rev=el.checked;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});

/* ---------- opstarten ---------- */
async function boot(){
  doRender();
  const c=window.claude;
  if(!c||!c.use){S.noDb=true;render();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){}
  S.db=db;S.user=user;
  if(user){try{const m=await user.me();S.uid=m.id;S.myName=m.name||'';S.canWrite=await user.can('data.write')}catch(e){}}
  if(!db||!S.uid){S.noDb=true;render();return}
  const fail=e=>{toast(errMsg(e))};
  db.collection('members').onSnapshot(sn=>{S.members=sn.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||(a.id<b.id?-1:1));S.ready.members=true;render()},fail);
  db.collection('months').onSnapshot(sn=>{S.months={};sn.docs.forEach(d=>S.months[d.id]=d.data());render()},fail);
  db.collection('spreads').onSnapshot(sn=>{S.spreads={};sn.docs.forEach(d=>S.spreads[d.id]=d.data());S.ready.spreads=true;render()},fail);
  db.collection('notes').onSnapshot(sn=>{S.notes=sn.docs.map(d=>Object.assign({id:d.id},d.data()));S.ready.notes=true;render()},fail);
  db.collection('deckimg').onSnapshot(sn=>{S.deckimg={};sn.docs.forEach(d=>S.deckimg[d.id]=d.data());render()},fail);
}
boot();
})();
</script>
